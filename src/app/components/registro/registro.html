<section class="registro">
  <h1>Crear cuenta</h1>

  <form class="registro__form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <label class="registro__label" for="registro-nombre">Nombre</label>
    <input id="registro-nombre" class="registro__input" type="text" formControlName="nombre" />

    <label class="registro__label" for="registro-apellido">Apellido</label>
    <input id="registro-apellido" class="registro__input" type="text" formControlName="apellido" />

    <label class="registro__label" for="registro-email">Email</label>
    <input id="registro-email" class="registro__input" type="email" formControlName="email" autocomplete="email" />

    <label class="registro__label" for="registro-telefono">Telefono</label>
    <input id="registro-telefono" class="registro__input" type="tel" formControlName="telefono" />

    <label class="registro__label" for="registro-password">Contrasena</label>
    <input
      id="registro-password"
      class="registro__input"
      type="password"
      formControlName="password"
      autocomplete="new-password"
    />

    @if (error()) {
      <p class="registro__error">{{ error() }}</p>
    }

    <button class="registro__submit" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Creando cuenta...' : 'Crear cuenta' }}
    </button>
  </form>

  <p class="registro__footer">
    Ya tenes cuenta? <a routerLink="/login">Ingresa</a>
  </p>
</section>
