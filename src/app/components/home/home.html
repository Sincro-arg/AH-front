<section class="home">
  <div class="home__header">
    <h1>Usuarios de ejemplo</h1>
    <a routerLink="/configuracion" class="home__config-link">Configuración</a>
  </div>

  @if (cargando()) {
    <p>Cargando...</p>
  } @else if (error()) {
    <p class="home__error">{{ error() }}</p>
  } @else {
    <ul class="home__lista">
      @for (u of usuarios(); track u.id) {
        <li>{{ u.nombre }} {{ u.apellido }} — {{ u.email }}</li>
      }
    </ul>
  }
</section>
