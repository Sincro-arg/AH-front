<section class="home">
  @if (usuario(); as u) {
    <h1>Hola, {{ u.nombre }}</h1>
    <p>Bienvenido a tu cuenta.</p>

    <dl class="home__datos">
      <dt>Email</dt>
      <dd>{{ u.email }}</dd>
      <dt>Telefono</dt>
      <dd>{{ u.telefono || 'Sin cargar' }}</dd>
      <dt>Miembro desde</dt>
      <dd>{{ u.fechaAlta | date: 'longDate' }}</dd>
    </dl>

    <a class="home__link" routerLink="/configuracion">Editar mi cuenta</a>
  }
</section>
