<section class="login-page">
  <div class="login-page__panel" aria-hidden="true">
    <div class="login-page__panel-bg">
      <span class="login-page__blob login-page__blob--1"></span>
      <span class="login-page__blob login-page__blob--2"></span>
    </div>

    <div class="login-page__panel-content">
      <span class="login-page__brand">
        <svg class="login-page__brand-logo" viewBox="0 0 32 32" fill="none" focusable="false">
          <rect x="6" y="6" width="20" height="20" rx="5" fill="var(--color-primary)" transform="rotate(45 16 16)" />
          <circle cx="16" cy="16" r="7" fill="none" stroke="#fff" stroke-width="2" />
          <path
            d="M16 16V10M16 16L21.2 19M16 16L10.8 19"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M16 12.6 18.3 16.8H13.7Z" fill="#fff" />
        </svg>
        PozoAuto
      </span>
      <p class="login-page__tagline">Invertí en autos, en pozo.</p>

      <svg class="login-page__illustration" viewBox="0 0 240 180" fill="none">
        <circle cx="120" cy="90" r="46" fill="var(--color-primary)" opacity="0.12" />
        <circle cx="120" cy="90" r="30" stroke="var(--color-primary)" stroke-width="3" opacity="0.35" />
        <path
          d="M40 150c26-34 60-51 80-51s54 17 80 51"
          stroke="var(--color-primary)"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.25"
        />
        <path
          d="M70 150c18-22 38-33 50-33s32 11 50 33"
          stroke="var(--color-primary)"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.45"
        />
      </svg>
    </div>
  </div>

  <div class="login-page__card">
    <h1>Ingresar</h1>

    @if (cuentaCreada()) {
      <p class="login__exito">Cuenta creada con exito. Ya podes ingresar.</p>
    }

    <form class="login__form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label class="login__label" for="login-email">Email</label>
      <input
        id="login-email"
        class="login__input"
        type="email"
        formControlName="email"
        autocomplete="email"
      />

      <label class="login__label" for="login-password">Contrasena</label>
      <input
        id="login-password"
        class="login__input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />

      @if (error()) {
        <p class="login__error">{{ error() }}</p>
      }

      <button class="login__submit" type="submit" [disabled]="enviando()">
        {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="login__footer">
      Todavia no tenes cuenta? <a routerLink="/registro">Registrate</a>
    </p>
  </div>
</section>
