<header class="header">
  <div class="header__inner">
    <a class="header__brand" [routerLink]="estaLogueado() ? '/cuenta' : '/'">
      <svg
        class="header__logo"
        viewBox="0 0 32 32"
        fill="none"
        aria-hidden="true"
        focusable="false"
      >
        <rect x="1" y="1" width="30" height="30" rx="9" fill="var(--color-primary)" />
        <ellipse cx="16" cy="25" rx="11" ry="3" fill="#fff" opacity="0.18" />
        <ellipse cx="16" cy="25" rx="7.5" ry="2.1" fill="#fff" opacity="0.32" />
        <ellipse cx="16" cy="25" rx="4" ry="1.1" fill="#fff" opacity="0.5" />
        <rect x="7" y="16.5" width="18" height="4.5" rx="2" fill="#fff" />
        <path
          d="M11 16.5 13 12.5c.3-.6.9-1 1.6-1h2.8c.7 0 1.3.4 1.6 1l2 4"
          stroke="#fff"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="11.3" cy="21" r="1.9" fill="var(--color-primary)" stroke="#fff" stroke-width="1.1" />
        <circle cx="20.7" cy="21" r="1.9" fill="var(--color-primary)" stroke="#fff" stroke-width="1.1" />
      </svg>
      <span class="header__brand-name">PozoAuto</span>
    </a>

    @if (estaLogueado()) {
      <nav class="header__nav">
        <a class="header__nav-link" routerLink="/pozos">Pozos</a>
        <a class="header__nav-link" routerLink="/mis-inversiones">Mis inversiones</a>
      </nav>

      <div class="header__user">
        <span class="header__date">{{ fechaHoy() }}</span>
        <a class="header__user-link" routerLink="/configuracion">
          {{ usuario()?.nombre }} {{ usuario()?.apellido }}
        </a>
        <button class="header__logout" type="button" (click)="logout()">Salir</button>
      </div>
    } @else {
      <nav class="header__nav">
        <a class="header__nav-link" routerLink="/pozos">Pozos</a>
        <a class="header__nav-link" routerLink="/login">Ingresar</a>
        <a class="header__nav-link" routerLink="/registro">Registrarme</a>
      </nav>
    }
  </div>
</header>
