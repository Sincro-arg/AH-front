<header class="header">
  <div class="header__inner">
    <a class="header__brand" [routerLink]="estaLogueado() ? '/cuenta' : '/'">
      <svg
        class="header__logo"
        viewBox="0 0 32 32"
        fill="none"
        aria-hidden="true"
        focusable="false"
      >
        <rect x="1" y="1" width="30" height="30" rx="9" fill="var(--color-primary)" />
        <path
          d="M8 19.5c0-1.1.35-2 1-2.7l1.4-4.3c.35-1.05 1.3-1.75 2.4-1.75h6.4c1.1 0 2.05.7 2.4 1.75l1.4 4.3c.65.7 1 1.6 1 2.7v2.3c0 .55-.45 1-1 1h-1c-.55 0-1-.45-1-1v-.6H10v.6c0 .55-.45 1-1 1H8c-.55 0-1-.45-1-1v-2.3Z"
          fill="#fff"
        />
        <path
          d="M10.6 16.5h10.8l-1.05-3.15a.9.9 0 0 0-.85-.62h-7c-.38 0-.72.25-.85.62l-1.05 3.15Z"
          fill="var(--color-primary)"
        />
        <circle cx="11.5" cy="21.5" r="1.4" fill="var(--color-primary)" />
        <circle cx="20.5" cy="21.5" r="1.4" fill="var(--color-primary)" />
      </svg>
      <span class="header__brand-name">PozoAuto</span>
    </a>

    @if (estaLogueado()) {
      <nav class="header__nav">
        <a class="header__nav-link" routerLink="/pozos">Pozos</a>
        <a class="header__nav-link" routerLink="/mis-inversiones">Mis inversiones</a>
      </nav>

      <div class="header__user">
        <span class="header__date">{{ fechaHoy() }}</span>
        <a class="header__user-link" routerLink="/configuracion">
          {{ usuario()?.nombre }} {{ usuario()?.apellido }}
        </a>
        <button class="header__logout" type="button" (click)="logout()">Salir</button>
      </div>
    } @else {
      <nav class="header__nav">
        <a class="header__nav-link" routerLink="/pozos">Pozos</a>
        <a class="header__nav-link" routerLink="/login">Ingresar</a>
        <a class="header__nav-link" routerLink="/registro">Registrarme</a>
      </nav>
    }
  </div>
</header>
